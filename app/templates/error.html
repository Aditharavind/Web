{% extends "public.html" %}
{% from 'partials/icons.html' import icon %}
{% block content %}
    <section class="section">
      <div class="shell error-box">
        <span class="eyebrow">Error</span>
        <h1>{{ error_title }}</h1>
        <p class="lead">{{ error_message }}</p>
        <div class="actions">
          <a href="/" class="action primary">Back to home {{ icon('arrow', 18) }}</a>
          <a href="/catalog" class="action outline">Browse products</a>
        </div>
      </div>
    </section>
{% endblock %}
