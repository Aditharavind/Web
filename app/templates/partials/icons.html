{% macro icon(name, size=24) -%}
  <svg width="{{ size }}"
       height="{{ size }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true"
       focusable="false">
    {% if name == "valve" %}
      <path d="M2 9h5v6H2zM17 9h5v6h-5zM7 10l10 4v-4L7 14zM12 10V5M8 5h8" />
    {% elif name == "tool" %}
      <path d="M14 6a5 5 0 0 0-6 6l-5 5a2 2 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3z" />
    {% elif name == "drop" %}
      <path d="M12 2s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13zM9 16a3 3 0 0 0 3 3" />
    {% elif name == "gauge" %}
      <circle cx="12" cy="12" r="9" />
      <path d="M12 12l4-4M5 12h1M12 5v1M18 12h1M9 18h6" />
    {% elif name == "shield" %}
      <path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6" />
    {% elif name == "globe" %}
      <circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" />
      <path d="M3 12h18M5 7h14M5 17h14" />
    {% elif name == "people" %}
      <circle cx="9" cy="8" r="3" />
      <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5" />
    {% elif name == "layers" %}
      <path d="M12 3L2 8l10 5 10-5-10-5zM2 12l10 5 10-5M2 16l10 5 10-5" />
    {% elif name == "mail" %}
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 6l9 7 9-7" />
    {% elif name == "pin" %}
      <path d="M19 9c0 6-7 12-7 12S5 15 5 9a7 7 0 1 1 14 0z" />
      <circle cx="12" cy="9" r="2" />
    {% elif name == "phone" %}
      <path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z" />
    {% elif name == "search" %}
      <circle cx="10" cy="10" r="6" />
      <path d="M15 15l6 6" />
    {% elif name == "whatsapp" %}
      <path fill="currentColor" stroke="none" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88a9.82 9.82 0 0 1 6.99 2.9 9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zm8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.49-8.41z" />
    {% elif name == "menu" %}
      <path d="M4 7h16M4 12h16M4 17h16" />
    {% elif name == "close" %}
      <path d="M6 6l12 12M18 6L6 18" />
    {% elif name == "box" %}
      <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
    {% elif name == "chart" %}
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
    {% elif name == "plus" %}
      <path d="M12 5v14M5 12h14" />
    {% elif name == "edit" %}
      <path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4" />
    {% elif name == "trash" %}
      <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />
    {% elif name == "external" %}
      <path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" />
    {% elif name == "logout" %}
      <path d="M10 4H4v16h6M16 8l4 4-4 4M20 12H9" />
    {% elif name == "image" %}
      <rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-8 9" />
    {% elif name == "warning" %}
      <path d="M12 3l10 18H2L12 3zM12 10v5M12 18v.5" />
    {% elif name == "star" %}
      <path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.200 9.500l6.100-.9L12 3z" />
    {% elif name == "check" %}
      <path d="M5 12l4 4L19 6" />
    {% else %}
      <path d="M4 12h16M14 6l6 6-6 6" />
    {% endif %}
  </svg>
{%- endmacro %}
