{% macro icon(name, size=24) -%}
  <svg width="{{ size }}"
       height="{{ size }}"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.5"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true"
       focusable="false">
    {% if name == "valve" %}
      <path d="M2 9h5v6H2zM17 9h5v6h-5zM7 10l10 4v-4L7 14zM12 10V5M8 5h8" />
    {% elif name == "tool" %}
      <path d="M14 6a5 5 0 0 0-6 6l-5 5a2 2 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3z" />
    {% elif name == "drop" %}
      <path d="M12 2s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13zM9 16a3 3 0 0 0 3 3" />
    {% elif name == "gauge" %}
      <circle cx="12" cy="12" r="9" />
      <path d="M12 12l4-4M5 12h1M12 5v1M18 12h1M9 18h6" />
    {% elif name == "shield" %}
      <path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM8 12l3 3 5-6" />
    {% elif name == "globe" %}
      <circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" />
      <path d="M3 12h18M5 7h14M5 17h14" />
    {% elif name == "people" %}
      <circle cx="9" cy="8" r="3" />
      <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5" />
    {% elif name == "layers" %}
      <path d="M12 3L2 8l10 5 10-5-10-5zM2 12l10 5 10-5M2 16l10 5 10-5" />
    {% elif name == "factory" %}
      <path d="M3 21V10l6 3V8l6 3V3h4l2 18H3zM7 17h1M12 17h1M17 17h1" />
    {% elif name == "mail" %}
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 6l9 7 9-7" />
    {% elif name == "pin" %}
      <path d="M19 9c0 6-7 12-7 12S5 15 5 9a7 7 0 1 1 14 0z" />
      <circle cx="12" cy="9" r="2" />
    {% elif name == "phone" %}
      <path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z" />
    {% elif name == "search" %}
      <circle cx="10" cy="10" r="6" />
      <path d="M15 15l6 6" />
    {% elif name == "check" %}
      <path d="M5 12l4 4L19 6" />
    {% else %}
      <path d="M4 12h16M14 6l6 6-6 6" />
    {% endif %}
  </svg>
{%- endmacro %}
