{% from 'partials/icons.html' import icon %}
<section class="quote-band">
  <div class="shell quote-inner">
    <div>
      <h2>Need a product or a quote?</h2>
      <p>Send the part number, quantity and delivery location. We will come back with a clear offer.</p>
    </div>
    <div class="actions">
      <a href="{{ contact_whatsapp_url }}" target="_blank" rel="noopener noreferrer" class="action primary">{{ icon('whatsapp', 20) }} Chat on WhatsApp</a>
      <a href="{{ contact_email_url }}" class="action outline">{{ icon('mail', 20) }} Send an email</a>
    </div>
  </div>
</section>
