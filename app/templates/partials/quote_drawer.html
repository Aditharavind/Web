{% from 'partials/icons.html' import icon %}
<div class="quote-drawer" data-quote-drawer hidden>
  <div class="quote-drawer-backdrop" data-quote-close></div>
  <aside class="quote-drawer-panel" role="dialog" aria-modal="true" aria-label="Quote list">
    <button type="button" class="quote-drawer-close" data-quote-close aria-label="Close quote list">{{ icon('close', 20) }}</button>
    {% with uid = 'drawer' %}{% include "partials/quote_builder.html" %}{% endwith %}
  </aside>
</div>
