{% from 'partials/icons.html' import icon %}
<nav class="navbar" aria-label="Primary">
  <a href="/" class="brand" aria-label="NAWA Global home"><img src="{{ url_for('static', path='nawa-logo-208.webp') }}?v={{ static_asset_version }}" alt="NAWA Global" width="208" height="108" fetchpriority="high"></a>
  <div class="nav-links" id="public-nav-links">
    {% for path, label, key in [('/', 'Home', 'home'), ('/catalog', 'Products', 'catalog'), ('/about', 'About', 'about'), ('/contact', 'Contact', 'contact')] %}
    <a href="{{ path }}" class="nav-link{% if active_nav == key %} active{% endif %}"{% if active_nav == key %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </div>
  <div class="nav-right"><a href="{{ contact_whatsapp_url }}" target="_blank" rel="noopener noreferrer" class="action whatsapp compact" aria-label="Chat with us on WhatsApp">{{ icon('whatsapp', 18) }} WhatsApp us</a></div>
  <button class="quote-toggle" type="button" data-quote-open aria-label="Open quote list">{{ icon('bag', 20) }}<span class="quote-toggle-label">Quote list</span><span class="quote-count" data-quote-count hidden>0</span></button>
  <button class="nav-menu-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="public-nav-links" aria-label="Toggle menu">{{ icon('menu', 22) }}</button>
</nav>
