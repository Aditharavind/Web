{% from 'partials/icons.html' import icon %}
<aside class="sidebar" aria-label="Admin sections">
  <div class="sidebar-pad">
    <div class="sidebar-label">Manage</div>
    <a href="{{ settings.admin_route }}/dashboard" class="sidebar-link{% if admin_section == 'dashboard' %} active{% endif %}">{{ icon('chart', 20) }} Dashboard</a>
    <a href="{{ settings.admin_route }}/products" class="sidebar-link{% if admin_section == 'products' %} active{% endif %}">{{ icon('box', 20) }} Products</a>
    <a href="{{ settings.admin_route }}/visitors" class="sidebar-link{% if admin_section == 'visitors' %} active{% endif %}">{{ icon('people', 20) }} Visitors</a>
  </div>
</aside>
