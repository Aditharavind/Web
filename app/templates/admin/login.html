{% extends "base.html" %}
{% from 'partials/icons.html' import icon %}
{% block body_class %}admin-site{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-head">
      <img class="login-logo" src="{{ url_for('static', path='nawa-logo.png') }}" alt="NAWA Global" width="400" height="208">
      <div class="login-subtitle">Admin sign in</div>
    </div>
    {% if error %}
    <div class="alert error" role="alert">{{ icon('warning', 20) }} <span>{{ error }}</span></div>
    {% endif %}
    <form method="post" action="{{ settings.admin_route }}/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group"><label class="form-label" for="login-username">Username</label><input id="login-username" type="text" name="username" class="form-control" autocomplete="username" required autofocus></div>
      <div class="form-group"><label class="form-label" for="login-password">Password</label><input id="login-password" type="password" name="password" class="form-control" autocomplete="current-password" required></div>
      <button type="submit" class="btn primary btn-block btn-large">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
