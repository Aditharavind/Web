name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          pytest -q
      - name: Sentry health check
        run: |
          python ci/sentry_verify.py || true
      - name: Lighthouse CI (optional)
        if: github.event_name == 'push'
        run: |
          echo "Skipping lighthouse in CI by default. Configure LHCI in a separate job if you host a preview server."
