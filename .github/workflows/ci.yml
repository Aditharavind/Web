name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node for JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript checks
        run: node --test tests/js/*.test.cjs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r dev_requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          alembic upgrade head
      - name: Check migration/model alignment
        env:
          DATABASE_URL: sqlite:///./test.db
        run: alembic check
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -q
